          return;
        }
        if (!password.trim()) {
          setError('Please enter your password.');
          return;
        }

        setLoading(true);
        setTimeout(() => {
          const found = accounts.find(a => a.email.toLowerCase() === trimmedEmail);
          if (!found) {
            setError('No registered account found with this email. Please check your spelling or create an account.');
            setLoading(false);
            return;
          }
          if (found.password && found.password !== password) {
            setError('Incorrect password. Please try again (Ex: Password123).');
            setLoading(false);
            return;
          }
          setLoading(false);
          onLoginSuccess(found);
        }, 200);
      };

                          type="button"
                          onClick={() => setRegRole(r.key)}
                          className={`py-1.5 px-2 rounded-lg text-xs font-semibold border ${

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">Password</label>
                    <input
                      type="password"
                      required
                      placeholder="Choose a password"

                  <div className="grid grid-cols-2 gap-2">

                      />

                    <div>
                      <label className="block font-bold text-slate-700 mb-1">Phone</label>
                      <input
                        type="tel"
                        placeholder="Enter phone number"
                        value={regPhone}

                        className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none focus:border-brand-600"
                      />
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full mt-2 py-3 px-4 rounded-xl bg-brand-700 hover:bg-brand-800 text-white font-heading font-bold text-xs shadow-md transition-all flex items-center justify-center gap-2"
                  >

                    <Icon name="arrow-right" className="w-4 h-4" />
                  </button>
                </form>
              )}

            </div>

          </div>

          {/* Footer Note */}
          <div className="w-full pb-6 text-center text-xs text-slate-500 relative z-10">
            <p>© 2026 SEVA CONNECT • "One Platform. Many Helping Hands."</p>
          </div>

        </div>
      );
    }

    // =========================================================================
    // MAIN APP COMPONENT
    // =========================================================================
    function App() {
      const [currentRoute, setCurrentRoute] = useState('home'); // home, explore, map, donate-page, ngos, volunteer, dashboard

      // Registered Accounts Database (Persistent across all sessions and reloads)
      const [accounts, setAccounts] = useState(() => {
        const saved = localStorage.getItem('SEVA_ACCOUNTS_DB');
        return saved ? JSON.parse(saved) : INITIAL_ACCOUNTS_DB;
      });

      useEffect(() => {
        localStorage.setItem('SEVA_ACCOUNTS_DB', JSON.stringify(accounts));
      }, [accounts]);

      // Active User Session State
      const [currentUser, setCurrentUser] = useState(() => {
        const sessionEmail = localStorage.getItem('SEVA_ACTIVE_SESSION');
        const savedDb = localStorage.getItem('SEVA_ACCOUNTS_DB');
        const db = savedDb ? JSON.parse(savedDb) : INITIAL_ACCOUNTS_DB;
        if (sessionEmail) {
          const found = db.find(a => a.email.toLowerCase() === sessionEmail.toLowerCase());
          if (found) return found;
        }
        return db[0]; // Default active demo user: Priya Sharma
      });

      // Login state: initial is false so user starts on the First Interface (Logo, Name, Slogan, Email & Password)
      const [isLoggedIn, setIsLoggedIn] = useState(false);

      const [currentRole, setCurrentRole] = useState(currentUser ? currentUser.role : 'beneficiary');

      // Sync active user profile changes
      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('SEVA_USER_PROFILE', JSON.stringify(currentUser));
          setCurrentRole(currentUser.role);
        }
      }, [currentUser]);

      // Collections with LocalStorage Persistence
      const [requests, setRequests] = useState(() => {
        const saved = localStorage.getItem('SEVA_REQUESTS_V2');
        return saved ? JSON.parse(saved) : INITIAL_REQUESTS;
      });

      const [donations, setDonations] = useState(() => {
        const saved = localStorage.getItem('SEVA_DONATIONS_V2');
        return saved ? JSON.parse(saved) : INITIAL_DONATIONS;
      });

      const [ngos, setNgos] = useState(() => {
        const saved = localStorage.getItem('SEVA_NGOS_V2');
        return saved ? JSON.parse(saved) : INITIAL_NGOS;
      });

      const [offers, setOffers] = useState(() => {
        const saved = localStorage.getItem('SEVA_OFFERS_V2');
        return saved ? JSON.parse(saved) : INITIAL_OFFERS;
      });

      const [campaigns, setCampaigns] = useState(() => {
        const saved = localStorage.getItem('SEVA_CAMPAIGNS_V2');
        return saved ? JSON.parse(saved) : INITIAL_CAMPAIGNS;
      });

      const [volunteers, setVolunteers] = useState(() => {
        const saved = localStorage.getItem('SEVA_VOLUNTEERS_V2');
        return saved ? JSON.parse(saved) : INITIAL_VOLUNTEER_OPPS;
      });

      const [notifications, setNotifications] = useState(() => {
        const saved = localStorage.getItem('SEVA_NOTIFS_V2');
        return saved ? JSON.parse(saved) : INITIAL_NOTIFICATIONS;
      });

      // LocalStorage synchronizers
      useEffect(() => { localStorage.setItem('SEVA_REQUESTS_V2', JSON.stringify(requests)); }, [requests]);
      useEffect(() => { localStorage.setItem('SEVA_DONATIONS_V2', JSON.stringify(donations)); }, [donations]);
      useEffect(() => { localStorage.setItem('SEVA_NGOS_V2', JSON.stringify(ngos)); }, [ngos]);
      useEffect(() => { localStorage.setItem('SEVA_OFFERS_V2', JSON.stringify(offers)); }, [offers]);
      useEffect(() => { localStorage.setItem('SEVA_CAMPAIGNS_V2', JSON.stringify(campaigns)); }, [campaigns]);
      useEffect(() => { localStorage.setItem('SEVA_VOLUNTEERS_V2', JSON.stringify(volunteers)); }, [volunteers]);
      useEffect(() => { localStorage.setItem('SEVA_NOTIFS_V2', JSON.stringify(notifications)); }, [notifications]);

      // Modals State
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [authModalMode, setAuthModalMode] = useState('login'); // 'login' | 'register'
      const [showProfileModal, setShowProfileModal] = useState(false);
      const [showRequestModal, setShowRequestModal] = useState(false);
      const [showDonateModal, setShowDonateModal] = useState(false);
      const [showOfferModal, setShowOfferModal] = useState(false);
      const [selectedRequestForOffer, setSelectedRequestForOffer] = useState(null);
      const [showNotifDropdown, setShowNotifDropdown] = useState(false);
      const [showCoordinationModal, setShowCoordinationModal] = useState(false);
      const [activeOfferCoordination, setActiveOfferCoordination] = useState(null);
      const [showNGOVerifyModal, setShowNGOVerifyModal] = useState(false);
      const [selectedNGOForReview, setSelectedNGOForReview] = useState(null);

      // Notification helper
      const pushNotification = (title, message) => {
        const newNotif = {
          id: 'notif-' + Date.now(),
          title,
          message,
          date: 'Just now',
          isRead: false
        };
        setNotifications(prev => [newNotif, ...prev]);
      };

      // Confetti helper
      const triggerConfetti = () => {
        if (window.confetti) {
          window.confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } });
        }
      };

      // Authentication Handlers
      const openAuth = (mode = 'login') => {
        setAuthModalMode(mode);
        setShowAuthModal(true);
      };

      const handleLoginSuccess = (account) => {
        setCurrentUser(account);
        setCurrentRole(account.role);
        setIsLoggedIn(true);
        localStorage.setItem('SEVA_ACTIVE_SESSION', account.email);
        setShowAuthModal(false);
        pushNotification('Welcome back!', `Signed in as ${account.name} (${account.email}). Your profile and community data are restored.`);
        triggerConfetti();
      };

      const handleRegisterSuccess = (newAccount) => {
        setAccounts(prev => [newAccount, ...prev]);
        if (newAccount.role === 'ngo') {
          const newNGO = {
            id: 'ngo-' + Date.now(),
            name: newAccount.name,
            regNumber: newAccount.regNumber || ('REG/' + Math.floor(Math.random() * 89999 + 10000)),
            mission: newAccount.bio || 'Serving local community through essential resources.',
            description: newAccount.bio,
            contactEmail: newAccount.email,
            contactPhone: newAccount.phone,
            whatsappNumber: newAccount.whatsappNumber || newAccount.phone,
            city: newAccount.city,
            locality: newAccount.locality,
            pincode: newAccount.pincode,
            fullAddress: newAccount.fullAddress,
            lat: newAccount.lat,
            lng: newAccount.lng,
            causes: ['Education', 'Food & Nutrition'],
            verificationStatus: 'verified',
            logoUrl: newAccount.avatarUrl,
            activeRequirements: 0,
            volunteersCount: 15
          };
          setNgos(prev => [newNGO, ...prev]);
        }
        setCurrentUser(newAccount);
        setCurrentRole(newAccount.role);
        setIsLoggedIn(true);
        localStorage.setItem('SEVA_ACTIVE_SESSION', newAccount.email);
        setShowAuthModal(false);
        pushNotification('Account Created Successfully!', `Welcome to SEVA CONNECT, ${newAccount.name}! You are now logged in with your password.`);
        triggerConfetti();
      };

      const handleLogout = () => {
        localStorage.removeItem('SEVA_ACTIVE_SESSION');
        setIsLoggedIn(false);
        pushNotification('Signed Out', 'You have been signed out. Log back in with your email and password anytime.');
      };

      // Quick Role / Persona switch for testing
      const handleRoleSwitch = (newRole) => {
        const found = accounts.find(a => a.role === newRole);
        if (found) {
          handleLoginSuccess(found);
        } else {
          setCurrentRole(newRole);
        }
      };

      // =========================================================================
      // FIRST INTERFACE: ONLY LOGO, WEB NAME, SLOGAN, EMAIL & PASSWORD
      // =========================================================================
      if (!isLoggedIn) {
        return (
          <FirstInterface 
            accounts={accounts}
            onLoginSuccess={handleLoginSuccess}
            onRegisterSuccess={handleRegisterSuccess}
          />
        );
      }

      // =========================================================================
      // SECOND INTERFACE: FULL PLATFORM (SHOWN AFTER ENTERING EMAIL & PASS)
      // =========================================================================
      return (
        <div className="flex flex-col min-h-screen">
          
          {/* =========================================================================
              TOP BANNER: QUICK ROLE TESTER & USER STATUS
             ========================================================================= */}
          <div className="bg-slate-900 text-slate-200 text-xs py-2 px-4 border-b border-slate-800">
            <div className="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="flex h-2 w-2 relative">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-brand-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-2 w-2 bg-brand-500"></span>
                </span>
                <span className="font-semibold text-white tracking-wide">SEVA CONNECT</span>
                <span className="text-slate-400 hidden sm:inline">|</span>
                <span className="text-brand-300 flex items-center gap-2 font-medium">
                  <span className="w-1.5 h-1.5 rounded-full bg-brand-400"></span>
                  Signed in as <strong className="text-white">{currentUser.name}</strong> ({currentUser.email})
                  <button 
                    onClick={handleLogout} 
                    className="ml-2 px-2.5 py-0.5 rounded-md bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 font-bold text-[11px] transition-colors"
                    title="Return to First Interface"
                  >
                    Sign Out
                  </button>
                </span>
              </div>

              {/* Instant Persona Switcher */}
              <div className="flex items-center gap-2">
                <span className="text-slate-400 font-medium hidden sm:inline">Quick Test Account:</span>
                <div className="inline-flex bg-slate-800 rounded-lg p-0.5 border border-slate-700">
                  {[
                    { key: 'beneficiary', label: 'Beneficiary' },
                    { key: 'donor', label: 'Donor' },
                    { key: 'ngo', label: 'NGO' },
                    { key: 'admin', label: 'Admin' }
                  ].map(r => (
                    <button
                      key={r.key}
                      onClick={() => handleRoleSwitch(r.key)}
                      className={`px-2.5 py-1 rounded-md text-xs font-semibold transition-all ${
                        currentRole === r.key 
                          ? 'bg-brand-600 text-white shadow-sm' 
                          : 'text-slate-300 hover:text-white hover:bg-slate-700/60'
                      }`}
                    >
                      {r.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* =========================================================================
              MAIN HEADER / NAVBAR
             ========================================================================= */}
          <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 h-20 flex items-center justify-between gap-4">
              
              {/* Logo */}
              <div 
                className="flex items-center gap-3 cursor-pointer group"
                onClick={() => setCurrentRoute('home')}
              >
                <div className="w-11 h-11 rounded-2xl bg-gradient-to-tr from-brand-700 to-brand-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20 group-hover:scale-105 transition-transform">
                  <Icon name="heart-handshake" className="w-6 h-6" />
                </div>
                <div>
                  <div className="flex items-center gap-1.5">
                    <span className="font-heading font-extrabold text-xl tracking-tight text-slate-900">SEVA</span>
                    <span className="font-heading font-extrabold text-xl tracking-tight text-saffron-600">CONNECT</span>
                  </div>
                  <p className="text-[11px] text-slate-500 font-medium hidden sm:block">One Platform. Many Helping Hands.</p>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="hidden md:flex items-center gap-1 lg:gap-2">
                {[
                  { route: 'home', label: 'Home' },
                  { route: 'map', label: '📍 Live Geo-Map' },
                  { route: 'explore', label: 'Explore Needs' },
                  { route: 'donate-page', label: 'Donate Items' },
                  { route: 'ngos', label: 'NGO Directory' },
                  { route: 'volunteer', label: 'Volunteering' }
                ].map(item => (
                  <button
                    key={item.route}
                    onClick={() => setCurrentRoute(item.route)}
                    className={`px-3.5 py-2 rounded-xl text-sm font-semibold transition-colors ${
                      currentRoute === item.route 
                        ? 'text-brand-700 bg-brand-50' 
                        : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}

                <button
                  onClick={() => setCurrentRoute('dashboard')}
                  className={`px-3.5 py-2 rounded-xl text-sm font-semibold transition-colors ${
                    currentRoute === 'dashboard'
                      ? 'text-brand-700 bg-brand-50'
                      : 'text-slate-600 hover:text-slate-900 hover:bg-slate-100'
                  }`}
                >
                  {currentRole === 'admin' ? 'Admin Portal' : 'My Dashboard'}
                </button>
              </nav>

              {/* Action Buttons */}
              <div className="flex items-center gap-2.5">
                
                {/* Live Geo-Map Shortcut for Mobile/Quick Access */}
                <button
                  onClick={() => setCurrentRoute('map')}
                  className="p-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 relative transition-colors md:hidden"
                  title="Live Map"
                >
                  <Icon name="map-pin" className="w-5 h-5 text-brand-600" />
                </button>

                {/* Notifications Bell */}
                <div className="relative">
                  <button
                    onClick={() => setShowNotifDropdown(!showNotifDropdown)}
                    className="p-2.5 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 relative transition-colors"
                  >
                    <Icon name="bell" className="w-5 h-5" />
                    {notifications.filter(n => !n.isRead).length > 0 && (
                      <span className="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-saffron-500 rounded-full border-2 border-white"></span>
                    )}
                  </button>

                  {/* Dropdown */}
                  {showNotifDropdown && (
                    <div className="absolute right-0 mt-2 w-80 sm:w-96 bg-white rounded-2xl shadow-xl border border-slate-200 p-4 z-50 animate-fade-in">
                      <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                        <h4 className="font-heading font-bold text-slate-900 text-sm">Notifications</h4>
                        <button 
                          onClick={() => setNotifications(notifications.map(n => ({ ...n, isRead: true })))}
                          className="text-xs text-brand-600 hover:underline"
                        >
                          Mark all as read
                        </button>
                      </div>
                      <div className="divide-y divide-slate-100 max-h-72 overflow-y-auto">
                        {notifications.length === 0 ? (
                          <p className="text-xs text-slate-400 py-6 text-center">No notifications yet.</p>
                        ) : (
                          notifications.map(notif => (
                            <div key={notif.id} className={`py-3 ${!notif.isRead ? 'bg-brand-50/40 -mx-2 px-2 rounded-lg' : ''}`}>
                              <p className="text-xs font-semibold text-slate-800">{notif.title}</p>
                              <p className="text-xs text-slate-600 mt-0.5">{notif.message}</p>
                              <span className="text-[10px] text-slate-400 mt-1 block">{notif.date}</span>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  )}
                </div>

                {/* Auth Buttons: Sign In / Register if guest, Profile / Sign Out if logged in */}
                {!isLoggedIn ? (
                  <div className="flex items-center gap-2">
                    <button
                      onClick={() => openAuth('login')}
                      className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl border border-slate-200 hover:border-brand-500 hover:bg-brand-50/50 text-slate-700 hover:text-brand-700 text-xs font-bold transition-all shadow-2xs active:scale-95"
                    >
                      <Icon name="lock" className="w-3.5 h-3.5 text-brand-600" />
                      <span>Sign In</span>
                    </button>
                    <button
                      onClick={() => openAuth('register')}
                      className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold transition-all shadow-sm active:scale-95"
                    >
                      <Icon name="user" className="w-3.5 h-3.5 text-brand-400" />
                      <span>Register</span>
                    </button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    {/* Current Profile Card Button */}
                    <button
                      onClick={() => setShowProfileModal(true)}
                      className="flex items-center gap-2 pl-2 pr-3 py-1.5 rounded-xl border border-brand-200 bg-brand-50/40 hover:bg-brand-50 transition-colors"
                      title="View / Edit Profile"
                    >
                      <img src={currentUser.avatarUrl} alt={currentUser.name} className="w-7 h-7 rounded-lg object-cover border border-brand-300" />
                      <div className="text-left hidden lg:block">
                        <span className="text-xs font-semibold text-slate-800 block leading-tight">{currentUser.name.split(' ')[0]}</span>
                        <span className="text-[10px] text-brand-700 font-bold capitalize">{currentUser.role}</span>
                      </div>
                    </button>

                    {/* Sign Out Button */}
                    <button
                      onClick={handleLogout}
                      className="p-2 rounded-xl border border-slate-200 text-slate-500 hover:text-rose-600 hover:bg-rose-50 transition-colors"
                      title="Sign Out"
                    >
                      <Icon name="log-out" className="w-4 h-4" />
                    </button>
                  </div>
                )}

              </div>
            </div>
          </header>

          {/* =========================================================================
              VIEW ROUTER
             ========================================================================= */}
          <main className="flex-grow">
            {currentRoute === 'home' && (
              <HomePageView 
                requests={requests}
                donations={donations}
                ngos={ngos}
                campaigns={campaigns}
                onRequestClick={() => setShowRequestModal(true)}
                onDonateClick={() => setShowDonateModal(true)}
                onExploreClick={() => setCurrentRoute('explore')}
                onMapClick={() => setCurrentRoute('map')}
                onNGOsClick={() => setCurrentRoute('ngos')}
                onVolunteerClick={() => setCurrentRoute('volunteer')}
                onRegisterClick={() => openAuth('register')}
                onFulfillOffer={(req) => {
                  setSelectedRequestForOffer(req);
                  setShowOfferModal(true);
                }}
              />
            )}

            {currentRoute === 'map' && (
              <LiveGeoMapView 
                ngos={ngos}
                requests={requests}
                donations={donations}
                currentUser={currentUser}
                onFulfillRequest={(req) => {
                  setSelectedRequestForOffer(req);
                  setShowOfferModal(true);
                }}
              />
            )}

            {currentRoute === 'explore' && (
              <ExploreRequestsView 
                requests={requests}
                donations={donations}
                onFulfillOffer={(req) => {
                  setSelectedRequestForOffer(req);
                  setShowOfferModal(true);
                }}
                onRequestHelp={() => setShowRequestModal(true)}
              />
            )}

            {currentRoute === 'donate-page' && (
              <DonatePageView 
                donations={donations}
                requests={requests}
                onOpenDonateModal={() => setShowDonateModal(true)}
                onFulfillOffer={(req) => {
                  setSelectedRequestForOffer(req);
                  setShowOfferModal(true);
                }}
              />
            )}

            {currentRoute === 'ngos' && (
              <NGODirectoryView 
                ngos={ngos}
                campaigns={campaigns}
                onRegisterNGO={() => openAuth('register')}
              />
            )}

            {currentRoute === 'volunteer' && (
              <VolunteerPageView 
                opportunities={volunteers}
                onApply={(opp) => {
                  pushNotification('Volunteer Application Sent', `Applied for "${opp.title}" with ${opp.ngoName}!`);
                  triggerConfetti();
                }}
              />
            )}

            {currentRoute === 'dashboard' && (
              <RoleDashboardView 
                currentRole={currentRole}
                currentUser={currentUser}
                requests={requests}
                donations={donations}
                offers={offers}
                ngos={ngos}
                campaigns={campaigns}
                volunteers={volunteers}
                onEditProfile={() => setShowProfileModal(true)}
                onRequestHelp={() => setShowRequestModal(true)}
                onDonateItem={() => setShowDonateModal(true)}
                onAcceptOffer={(off) => {
                  setOffers(offers.map(o => o.id === off.id ? { ...o, status: 'accepted' } : o));
                  pushNotification('Offer Accepted', `Accepted donation offer from ${off.donorName}! Coordination is now open.`);
                  triggerConfetti();
                }}
                onDeclineOffer={(off) => {
                  setOffers(offers.map(o => o.id === off.id ? { ...o, status: 'declined' } : o));
                  pushNotification('Offer Declined', `Declined donation offer.`);
                }}
                onOpenCoordination={(off) => {
                  setActiveOfferCoordination(off);
                  setShowCoordinationModal(true);
                }}
                onConfirmReceipt={(off) => {
                  setOffers(offers.map(o => o.id === off.id ? { ...o, status: 'received' } : o));
                  setRequests(requests.map(r => {
                    if (r.id === off.requestId) {
                      const newFulfilled = r.quantityFulfilled + off.offeredQuantity;
                      return {
                        ...r,
                        quantityFulfilled: newFulfilled,
                        status: newFulfilled >= r.quantityNeeded ? 'fulfilled' : 'partially_fulfilled'
                      };
                    }
                    return r;
                  }));
                  pushNotification('Donation Handover Confirmed!', `Received ${off.offeredQuantity} items! Thank you!`);
                  triggerConfetti();
                }}

                setShowRequestModal(false);
                triggerConfetti();

          {/* =========================================================================

          {showDonateModal && (

              requests={requests}

              onSubmit={(newDon) => {
                setDonations([newDon, ...donations]);

                setShowDonateModal(false);
                triggerConfetti();
              }}
            />
          )}

          {/* =========================================================================
              MODAL: OFFER HELP
             ========================================================================= */}
          {showOfferModal && selectedRequestForOffer && (
            <OfferHelpModal 
              request={selectedRequestForOffer}
              currentUser={currentUser}
              onClose={() => {
                setShowOfferModal(false);
                setSelectedRequestForOffer(null);
              }}
              onSubmit={(offerData) => {
                const newOffer = {
                  id: 'off-' + Date.now(),
                  requestId: selectedRequestForOffer.id,
                  requestTitle: selectedRequestForOffer.title,
                  donorName: currentUser.name,
                  donorRole: currentUser.role,
                  recipientName: selectedRequestForOffer.requesterName,
                  offeredQuantity: offerData.quantity,
                  message: offerData.message,
                  status: 'pending',
                  date: new Date().toISOString().split('T')[0]
                };
                setOffers([newOffer, ...offers]);
                pushNotification('Offer Sent!', `Your offer of ${offerData.quantity} items was submitted.`);
                setShowOfferModal(false);
                setSelectedRequestForOffer(null);
                triggerConfetti();

          {/* =========================================================================
              MODAL: PROTECTED HANDOVER CHAT
             ========================================================================= */}
          {showCoordinationModal && activeOfferCoordination && (
            <CoordinationModal

              currentUser={currentUser}
              onClose={() => {
                setShowCoordinationModal(false);
                setActiveOfferCoordination(null);
              }}
              onMarkHandedOver={() => {
                setOffers(offers.map(o => o.id === activeOfferCoordination.id ? { ...o, status: 'handed_over' } : o));
                pushNotification('Handover Status Updated', 'Donor marked items as handed over.');
                setShowCoordinationModal(false);
              }}
              onConfirmReceipt={() => {
                setOffers(offers.map(o => o.id === activeOfferCoordination.id ? { ...o, status: 'received' } : o));
                setRequests(requests.map(r => {
                  if (r.id === activeOfferCoordination.requestId) {
                    const newFulfilled = r.quantityFulfilled + activeOfferCoordination.offeredQuantity;
                    return {
                      ...r,
                      quantityFulfilled: newFulfilled,
                      status: newFulfilled >= r.quantityNeeded ? 'fulfilled' : 'partially_fulfilled'
                    };
                  }
                  return r;
                }));
                pushNotification('Receipt Confirmed!', 'Thank you! The request status has been updated.');
                setShowCoordinationModal(false);
                triggerConfetti();
              }}
            />
          )}

          {/* =========================================================================
              MODAL: NGO VERIFICATION INSPECTION (ADMIN)
             ========================================================================= */}
          {showNGOVerifyModal && selectedNGOForReview && (
            <NGOVerifyModal 
              ngo={selectedNGOForReview}
              onClose={() => {
                setShowNGOVerifyModal(false);
                setSelectedNGOForReview(null);
              }}
              onApprove={() => {
                setNgos(ngos.map(n => n.id === selectedNGOForReview.id ? { ...n, verificationStatus: 'verified' } : n));
                pushNotification('NGO Verified', `${selectedNGOForReview.name} has been verified.`);
                setShowNGOVerifyModal(false);
                setSelectedNGOForReview(null);
              }}
              onReject={() => {
                setNgos(ngos.map(n => n.id === selectedNGOForReview.id ? { ...n, verificationStatus: 'rejected' } : n));
                pushNotification('NGO Rejected', `${selectedNGOForReview.name} verification rejected.`);
                setShowNGOVerifyModal(false);
                setSelectedNGOForReview(null);
              }}
            />
          )}

          {/* =========================================================================
              FOOTER
             ========================================================================= */}
          <footer className="bg-slate-900 text-slate-300 pt-16 pb-12 border-t border-slate-800 mt-20">

                    <span className="font-heading font-extrabold text-2xl tracking-tight text-white">

                  <div className="p-3 bg-slate-800/80 rounded-xl border border-slate-700/60 text-xs text-slate-300 leading-normal max-w-sm">
                    <div className="flex items-center gap-2 text-brand-400 font-semibold mb-1">

    // =========================================================================
    // VIEW: LIVE INTERACTIVE GEO-MAP (LEAFLET + GOOGLE MAPS NAVIGATION)
    // =========================================================================
    function LiveGeoMapView({ ngos, requests, donations, currentUser, onFulfillRequest }) {
      const mapContainerRef = useRef(null);
      const leafletMapRef = useRef(null);
      const markersLayerRef = useRef(null);
      const [mapFilter, setMapFilter] = useState('all'); // all, ngos, donors, requests
      const [selectedItem, setSelectedItem] = useState(null);

      // Initialize Leaflet Map (Once on mount)
      useEffect(() => {
        if (!mapContainerRef.current) return;
        if (typeof L === 'undefined') return;

        // Clean up previous instance if any
        if (leafletMapRef.current) {
          try {
            leafletMapRef.current.remove();
          } catch (e) {
            console.error('Error removing previous map:', e);
          }
          leafletMapRef.current = null;
        }
        if (mapContainerRef.current._leaflet_id) {
          mapContainerRef.current._leaflet_id = null;
        }

        // Default center: Akurdi, Pune (18.6495, 73.7718)
        const map = L.map(mapContainerRef.current, {
          center: [18.6495, 73.7718],
          zoom: 13,
          zoomControl: true,
          scrollWheelZoom: true
        });
        leafletMapRef.current = map;

        // OpenStreetMap Tile Layer with subdomains
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19,
          subdomains: ['a', 'b', 'c'],
          attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors | Google Maps Directions'
        }).addTo(map);

        // Marker layer group
        const markersGroup = L.layerGroup().addTo(map);
        markersLayerRef.current = markersGroup;

        // Invalidate map size multiple times to ensure tiles render completely across the container
        const t1 = setTimeout(() => {
          if (leafletMapRef.current) leafletMapRef.current.invalidateSize();
        }, 150);
        const t2 = setTimeout(() => {
          if (leafletMapRef.current) leafletMapRef.current.invalidateSize();
        }, 500);

        const handleResize = () => {
          if (leafletMapRef.current) leafletMapRef.current.invalidateSize();
        };
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          clearTimeout(t1);
          clearTimeout(t2);
          if (leafletMapRef.current) {
            try {
              leafletMapRef.current.remove();
            } catch (e) {}
            leafletMapRef.current = null;
          }
        };
      }, []);

      // Populate / update markers when filter or data changes
      useEffect(() => {
        if (!leafletMapRef.current || !markersLayerRef.current) return;
        if (typeof L === 'undefined') return;

        const map = leafletMapRef.current;
        const markersGroup = markersLayerRef.current;
        markersGroup.clearLayers();

        // Custom Marker Icons
        const createCustomIcon = (color, emoji) => {
          return L.divIcon({
            className: 'custom-div-icon',
            html: `
              <div style="background-color: ${color}; width: 36px; height: 36px; border-radius: 50%; border: 3px solid white; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); display: flex; align-items: center; justify-content: center; font-size: 16px; color: white;">
                ${emoji}
              </div>
            `,
            iconSize: [36, 36],
            iconAnchor: [18, 18],
            popupAnchor: [0, -18]
          });
        };

        const ngoIcon = createCustomIcon('#059669', '🏢'); // Green
        const donorIcon = createCustomIcon('#ea580c', '🎁'); // Orange
        const requestIcon = createCustomIcon('#dc2626', '🆘'); // Red
        const userIcon = createCustomIcon('#2563eb', '👤'); // Blue

        // Plot User marker
        if (currentUser && currentUser.lat && currentUser.lng) {
          const userMarker = L.marker([currentUser.lat, currentUser.lng], { icon: userIcon }).addTo(markersGroup);
          userMarker.bindPopup(`
            <div style="min-width: 180px;">
              <span style="font-size: 10px; font-weight: bold; background: #dbeafe; color: #1e40af; padding: 2px 6px; border-radius: 4px;">YOU ARE HERE</span>
              <h4 style="font-weight: bold; margin-top: 4px; font-size: 13px;">${currentUser.name || 'User'}</h4>
              <p style="font-size: 11px; color: #64748b; margin: 2px 0;">${currentUser.locality || ''}, ${currentUser.city || ''}</p>
            </div>
          `);
        }

        // Plot NGOs
        if (mapFilter === 'all' || mapFilter === 'ngos') {
          (ngos || []).forEach(ngo => {
            if (ngo.lat && ngo.lng) {
              const marker = L.marker([ngo.lat, ngo.lng], { icon: ngoIcon }).addTo(markersGroup);
              marker.on('click', () => setSelectedItem({ type: 'ngo', data: ngo }));
              marker.bindPopup(`
                <div style="min-width: 220px;">
                  <span style="font-size: 10px; font-weight: bold; background: #d1fae5; color: #065f46; padding: 2px 6px; border-radius: 4px;">VERIFIED NGO</span>
                  <h4 style="font-weight: bold; margin-top: 4px; font-size: 14px;">${ngo.name}</h4>
                  <p style="font-size: 11px; color: #475569; margin: 4px 0;">${ngo.locality}, ${ngo.city}</p>
                  <p style="font-size: 11px; font-weight: 600; color: #059669;">📞 ${ngo.contactPhone}</p>
                  <a href="${getGoogleMapsDirectionsUrl(ngo.lat, ngo.lng, ngo.fullAddress)}" target="_blank" style="display: inline-block; margin-top: 6px; font-size: 11px; font-weight: bold; color: #ea580c; text-decoration: underline;">Open in Google Maps →</a>
                </div>
              `);
            }
          });
        }

        // Plot Donors
        if (mapFilter === 'all' || mapFilter === 'donors') {
          (donations || []).forEach(don => {
            if (don.lat && don.lng) {
              const marker = L.marker([don.lat, don.lng], { icon: donorIcon }).addTo(markersGroup);
              marker.on('click', () => setSelectedItem({ type: 'donation', data: don }));
              marker.bindPopup(`
                <div style="min-width: 220px;">
                  <span style="font-size: 10px; font-weight: bold; background: #ffedd5; color: #9a3412; padding: 2px 6px; border-radius: 4px;">DONOR LISTING</span>
                  <h4 style="font-weight: bold; margin-top: 4px; font-size: 14px;">${don.itemName}</h4>
                  <p style="font-size: 11px; color: #475569; margin: 4px 0;">By: ${don.donorName} (${don.quantityAvailable} units)</p>
                  <p style="font-size: 11px; font-weight: 600; color: #059669;">📞 ${don.contactPhone}</p>
                  <a href="${getGoogleMapsDirectionsUrl(don.lat, don.lng, don.fullAddress)}" target="_blank" style="display: inline-block; margin-top: 6px; font-size: 11px; font-weight: bold; color: #ea580c; text-decoration: underline;">Get Google Maps Directions →</a>
                </div>
              `);
            }
          });
        }

        // Plot Requests
        if (mapFilter === 'all' || mapFilter === 'requests') {
          (requests || []).forEach(req => {
            if (req.lat && req.lng) {
              const marker = L.marker([req.lat, req.lng], { icon: requestIcon }).addTo(markersGroup);
              marker.on('click', () => setSelectedItem({ type: 'request', data: req }));
              marker.bindPopup(`
                <div style="min-width: 220px;">
                  <span style="font-size: 10px; font-weight: bold; background: #fee2e2; color: #991b1b; padding: 2px 6px; border-radius: 4px;">HELP NEEDED (${(req.urgency || '').toUpperCase()})</span>
                  <h4 style="font-weight: bold; margin-top: 4px; font-size: 14px;">${req.title}</h4>
                  <p style="font-size: 11px; color: #475569; margin: 4px 0;">Locality: ${req.locality} (${req.quantityNeeded} units)</p>
                  <p style="font-size: 11px; font-weight: 600; color: #059669;">📞 ${req.contactPhone}</p>
                  <a href="${getGoogleMapsDirectionsUrl(req.lat, req.lng, req.fullAddress)}" target="_blank" style="display: inline-block; margin-top: 6px; font-size: 11px; font-weight: bold; color: #ea580c; text-decoration: underline;">Google Maps Location →</a>
                </div>
              `);
            }
          });
        }

        // Ensure map layout remains updated after markers change
        map.invalidateSize();
      }, [mapFilter, ngos, requests, donations, currentUser]);

      // Jump to user GPS
      const handleDetectLocation = () => {
        if (!navigator.geolocation) {
          alert('Geolocation is not supported by your browser.');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            if (leafletMapRef.current) {
              leafletMapRef.current.setView([pos.coords.latitude, pos.coords.longitude], 15);
              leafletMapRef.current.invalidateSize();
            }
          },
          (err) => {
            alert('Location permission denied or unavailable. Using Akurdi, Pune as default.');
          }
        );
      };

      // Fit all markers in view
      const handleFitAllPins = () => {
        if (!leafletMapRef.current || !markersLayerRef.current) return;
        const layers = markersLayerRef.current.getLayers();
        if (layers.length > 0) {
          const group = L.featureGroup(layers);
          leafletMapRef.current.fitBounds(group.getBounds().pad(0.15));
        } else {
          leafletMapRef.current.setView([18.6495, 73.7718], 13);
        }
        leafletMapRef.current.invalidateSize();
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">
          
          {/* Header Bar */}
          <div className="bg-gradient-to-br from-teal-50/90 via-white to-emerald-50/70 p-6 sm:p-8 rounded-3xl border border-teal-200/90 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="p-1.5 rounded-lg bg-teal-100 text-teal-700 border border-teal-200">
                  <Icon name="compass" className="w-5 h-5 text-teal-700" />
                </span>
                <span className="text-xs font-bold uppercase tracking-wider bg-teal-100 text-teal-800 px-3 py-1 rounded-full border border-teal-200">
                  Live Interactive Map
                </span>
              </div>
              <h1 className="font-heading font-extrabold text-2xl sm:text-3xl text-teal-700 mt-2">
                Live Community Geo-Map
              </h1>
              <p className="text-slate-600 text-xs sm:text-sm mt-1">
                Explore nearby verified NGOs, donor resources, and open help requests. Click any pin to call directly or navigate via Google Maps!
              </p>
            </div>

            {/* Quick Map Controls */}
            <div className="flex items-center gap-2 flex-wrap">
              <button
                onClick={handleDetectLocation}
                className="px-3.5 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold shadow-2xs flex items-center gap-1.5 transition-colors"
              >
                <Icon name="navigation" className="w-3.5 h-3.5 text-brand-600" />
                <span>Locate Me (GPS)</span>
              </button>

              <button
                onClick={handleFitAllPins}
                className="px-3.5 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-semibold shadow-2xs flex items-center gap-1.5 transition-colors"
                title="Fit all markers in view"
              >
                <Icon name="maximize" className="w-3.5 h-3.5 text-teal-600" />
                <span>Fit All Pins</span>
              </button>

              <div className="inline-flex bg-slate-100 rounded-xl p-1 border border-slate-200">
                {[
                  { key: 'all', label: 'All Pins' },
                  { key: 'ngos', label: '🏢 NGOs' },
                  { key: 'donors', label: '🎁 Donors' },
                  { key: 'requests', label: '🆘 Needs' }
                ].map(tab => (
                  <button
                    key={tab.key}
                    onClick={() => setMapFilter(tab.key)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${
                      mapFilter === tab.key 
                        ? 'bg-brand-700 text-white shadow-xs' 
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    {tab.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* Map Layout: Left Map + Right Details Drawer */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            {/* The Map Box */}
            <div className="lg:col-span-2 bg-white rounded-3xl border border-slate-200 shadow-sm overflow-hidden h-[540px] relative min-h-[500px]">
              <div 
                ref={mapContainerRef} 
                className="w-full h-full"
                style={{ width: '100%', height: '100%', minHeight: '520px', zIndex: 1 }}
              ></div>
              
              {/* Floating Map Legend */}
              <div className="absolute bottom-4 left-4 z-[1000] bg-white/95 backdrop-blur-md p-3 rounded-2xl shadow-lg border border-slate-200 text-[11px] font-semibold space-y-1.5 pointer-events-auto">
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-emerald-600"></span>
                  <span>Verified NGO Centers</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-orange-600"></span>
                  <span>Donor Drop/Pickup Points</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-red-600"></span>
                  <span>Urgent Community Requests</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="w-3 h-3 rounded-full bg-blue-600"></span>
                  <span>Your Current Location</span>
                </div>
              </div>
            </div>

            {/* Selected Location / Quick Contact Drawer */}
            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between">
              {selectedItem ? (
                <div>
                  <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                    <span className="text-[10px] font-extrabold uppercase px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-800">
                      {selectedItem.type.toUpperCase()} SPOTLIGHT
                    </span>
                    <button onClick={() => setSelectedItem(null)} className="text-slate-400 hover:text-slate-600 text-xs">Clear</button>
                  </div>

                  <div className="mt-4">
                    <h3 className="font-heading font-extrabold text-lg text-slate-900">
                      {selectedItem.data.name || selectedItem.data.title || selectedItem.data.itemName}
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5 flex items-center gap-1">
                      <Icon name="map-pin" className="w-3.5 h-3.5 text-brand-600" />
                      <span>{selectedItem.data.fullAddress || `${selectedItem.data.locality}, ${selectedItem.data.city}`}</span>
                    </p>

                    <p className="text-xs text-slate-600 mt-3 leading-relaxed">

    // =========================================================================
    // MODAL: AUTHENTICATION (SIGN IN WITH EMAIL/PASS & CREATE ACCOUNT)
    // =========================================================================
    function AuthModal({ initialMode = 'login', accounts = [], onClose, onLoginSuccess, onRegisterSuccess }) {
      const [mode, setMode] = useState(initialMode); // 'login' | 'register'
      
      // Login Form State
      const [loginEmail, setLoginEmail] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [showLoginPassword, setShowLoginPassword] = useState(false);
      const [loginError, setLoginError] = useState('');

      // Registration Form State
      const [regRole, setRegRole] = useState('beneficiary'); // beneficiary, donor, ngo, volunteer
      const [regName, setRegName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [regConfirmPassword, setRegConfirmPassword] = useState('');
      const [showRegPassword, setShowRegPassword] = useState(false);
      const [regPhone, setRegPhone] = useState('');
      const [regWhatsappNumber, setRegWhatsappNumber] = useState('');
      const [regCity, setRegCity] = useState('');
      const [regLocality, setRegLocality] = useState('');
      const [regPincode, setRegPincode] = useState('');
      const [regFullAddress, setRegFullAddress] = useState('');
      const [regLat, setRegLat] = useState(18.6495);
      const [regLng, setRegLng] = useState(73.7718);
      const [regNumber, setRegNumber] = useState('');
      const [regBio, setRegBio] = useState('');
      const [regAvatarUrl, setRegAvatarUrl] = useState('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80');
      const [regError, setRegError] = useState('');
      const fileInputRef = useRef(null);

      // Handle Image File Upload (Device / Camera / File explorer)
      const handleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          alert('Please select a valid image file (PNG, JPG, JPEG, WEBP).');
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          alert('Image file is larger than 5MB. Please choose a smaller image.');
          return;
        }
        const reader = new FileReader();
        reader.onload = (loadEvt) => {
          setRegAvatarUrl(loadEvt.target.result);
        };
        reader.readAsDataURL(file);
      };

      // Handle GPS Auto-detect
      const handleGetGPS = () => {
        if (!navigator.geolocation) {
          alert('GPS Geolocation is not supported by your browser.');
          return;
        }
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            setRegLat(Number(pos.coords.latitude.toFixed(6)));
            setRegLng(Number(pos.coords.longitude.toFixed(6)));
            alert(`GPS location detected: Lat ${pos.coords.latitude.toFixed(4)}, Lng ${pos.coords.longitude.toFixed(4)}`);
          },
          () => {
            alert('Location access denied or unavailable. Using default Akurdi coordinates.');
          }
        );
      };

      // Handle Login Submission
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        setLoginError('');
        const trimmedEmail = loginEmail.trim().toLowerCase();
        const found = accounts.find(a => a.email.toLowerCase() === trimmedEmail);

        if (!found) {
          setLoginError('No account found with this email address. Please register or check spelling.');
          return;
        }

        if (found.password && found.password !== loginPassword) {
          setLoginError('Incorrect password. Please try again or use a demo account.');
          return;
        }

        onLoginSuccess(found);
      };

      // Quick 1-Click Persona Login
      const handleQuickDemoLogin = (acc) => {
        setLoginEmail(acc.email);
        setLoginPassword(acc.password || 'password123');
        onLoginSuccess(acc);
      };

      // Handle Registration Submission
      const handleRegisterSubmit = (e) => {
        e.preventDefault();
        setRegError('');

        if (!regName.trim() || !regEmail.trim() || !regPhone.trim()) {
          setRegError('Please fill in your name, email, and phone number.');
          return;
        }

        if (!regPassword || regPassword.length < 6) {
          setRegError('Password must be at least 6 characters long.');
          return;
        }

        if (regPassword !== regConfirmPassword) {
          setRegError('Passwords do not match. Please re-enter.');
          return;
        }

        const trimmedEmail = regEmail.trim().toLowerCase();
        if (accounts.some(a => a.email.toLowerCase() === trimmedEmail)) {
          setRegError('An account with this email already exists. Please Sign In instead.');
          return;
        }

        const newAccount = {
          id: 'usr-' + Date.now(),
          name: regName.trim(),
          role: regRole,
          email: trimmedEmail,
          password: regPassword,
          phone: regPhone.trim(),
          whatsappNumber: (regWhatsappNumber.trim() || regPhone.trim()),
          city: regCity.trim(),
          locality: regLocality.trim(),
          pincode: regPincode.trim(),
          fullAddress: regFullAddress.trim(),
          lat: Number(regLat),
          lng: Number(regLng),
          regNumber: regRole === 'ngo' ? regNumber.trim() : undefined,
          bio: regBio.trim(),
          avatarUrl: regAvatarUrl
        };

        onRegisterSuccess(newAccount);
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/65 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-2xl max-h-[92vh] overflow-y-auto p-6 sm:p-8">
            
            {/* Modal Header & Close */}
            <div className="flex items-center justify-between pb-4 border-b border-slate-100">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-2xl bg-brand-50 border border-brand-200 flex items-center justify-center text-brand-700">
                  <Icon name={mode === 'login' ? 'lock' : 'user'} className="w-5 h-5" />
                </div>
                <div>
                  <h3 className="font-heading font-extrabold text-xl text-slate-900">
                    {mode === 'login' ? 'Sign In to SEVA CONNECT' : 'Create an Account'}
                  </h3>
                  <p className="text-xs text-slate-500 mt-0.5">
                    {mode === 'login' 
                      ? 'Enter your email & password to retrieve your profile, requests, and community data.' 
                      : 'Join as a Beneficiary, Donor, NGO, or Volunteer with profile photo & location.'}
                  </p>
                </div>
              </div>
              <button 
                onClick={onClose} 
                className="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition-colors"
              >
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            {/* Mode Switcher Tabs */}
            <div className="mt-5 grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-2xl">
              <button
                type="button"

    // =========================================================================
    // MODAL: EDIT PROFILE
    // =========================================================================
    function ProfileEditModal({ currentUser, onClose, onSave }) {
      const [name, setName] = useState(currentUser.name);
      const [phone, setPhone] = useState(currentUser.phone);
      const [whatsappNumber, setWhatsappNumber] = useState(currentUser.whatsappNumber || currentUser.phone);
      const [locality, setLocality] = useState(currentUser.locality);
      const [fullAddress, setFullAddress] = useState(currentUser.fullAddress);
      const [lat, setLat] = useState(currentUser.lat || 18.6495);
      const [lng, setLng] = useState(currentUser.lng || 73.7718);
      const [bio, setBio] = useState(currentUser.bio || '');
      const [avatarUrl, setAvatarUrl] = useState(currentUser.avatarUrl || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=200&q=80');
      const fileInputRef = useRef(null);

      // Handle Image File Upload in Profile Edit
      const handleFileUpload = (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          alert('Please select a valid image file (PNG, JPG, JPEG, WEBP).');
          return;
        }
        if (file.size > 5 * 1024 * 1024) {
          alert('Image file is larger than 5MB. Please choose a smaller image.');
          return;
        }
        const reader = new FileReader();
        reader.onload = (loadEvt) => {
          setAvatarUrl(loadEvt.target.result);
        };
        reader.readAsDataURL(file);
      };

      const handleSave = (e) => {
        e.preventDefault();
        onSave({
          ...currentUser,
          name,
          phone,
          whatsappNumber,
          locality,
          fullAddress,
          lat: Number(lat),
          lng: Number(lng),
          bio,
          avatarUrl
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-lg p-6 sm:p-8 max-h-[92vh] overflow-y-auto">
            <div className="flex items-center justify-between pb-4 border-b border-slate-100">
              <h3 className="font-heading font-extrabold text-xl text-slate-900">Edit Profile & Location</h3>
              <button onClick={onClose} className="p-2 rounded-xl text-slate-400 hover:text-slate-600">
                <Icon name="x" className="w-5 h-5" />
              </button>
            </div>

            <form onSubmit={handleSave} className="mt-5 space-y-4 text-xs">
              
              {/* Profile Photo / Logo Update */}
              <div className="p-4 bg-slate-50 border border-slate-200 rounded-2xl">
                <label className="font-bold text-slate-800 block text-xs mb-2">Update Profile Photo / Logo</label>
                <div className="flex items-center gap-4">
                  <img src={avatarUrl} alt="Avatar" className="w-16 h-16 rounded-2xl object-cover border-2 border-brand-500 shadow-sm bg-white" />
                  
                  <div className="space-y-1.5 flex-1">
                    <input ref={fileInputRef} type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
                    <button
                      type="button"
                      onClick={() => fileInputRef.current && fileInputRef.current.click()}
                      className="px-3 py-1.5 rounded-xl bg-brand-700 hover:bg-brand-800 text-white font-bold text-xs flex items-center gap-1.5 shadow-2xs"
                    >
                      <Icon name="plus" className="w-3.5 h-3.5" />
                      <span>Upload New Photo</span>
                    </button>
                    <button
                      type="button"
                      onClick={() => {
                        const url = prompt('Enter custom image web URL:', avatarUrl);
                        if (url && url.trim()) setAvatarUrl(url.trim());
                      }}
                      className="text-[11px] text-slate-600 font-semibold hover:underline block"
                    >
                      Or paste image URL
                    </button>
                  </div>
                </div>
              </div>

              <div>

    // =========================================================================

          quantityFulfilled: 0,
          urgency,
          city,

          fullAddress: `${locality}, ${city}`,

            <form onSubmit={handleSubmit} className="mt-5 space-y-4 text-xs">

                <label className="font-bold text-slate-700 block mb-1">Title *</label>

              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Category *</label>

                <div>

                    <option value="normal">Normal</option>
                    <option value="urgent">Urgent</option>
                    <option value="critical">Critical</option>
                  </select>

              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Items Spec *</label>
                  <input type="text" required placeholder="Bags, notebooks" value={itemsNeeded} onChange={(e) => setItemsNeeded(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs" />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Quantity Needed *</label>
                  <input type="number" min="1" required value={quantityNeeded} onChange={(e) => setQuantityNeeded(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Contact Phone (For Donors to Call) *</label>
                  <input type="text" required value={contactPhone} onChange={(e) => setContactPhone(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs" />
                </div>
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Locality *</label>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Description *</label>

              <div className="pt-4 flex justify-end gap-3 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-4 py-2 rounded-xl border border-slate-200">Cancel</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-brand-700 text-white font-bold">Publish Need</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: DONATE ITEMS
    // =========================================================================
    function DonateItemModal({ currentUser, requests, onClose, onSubmit }) {

      const [condition, setCondition] = useState('gently_used');
      const [locality, setLocality] = useState(currentUser.locality || '');
      const [contactPhone, setContactPhone] = useState(currentUser.phone || '');
      const [lat, setLat] = useState(currentUser.lat || 18.6495);
      const [lng, setLng] = useState(currentUser.lng || 73.7718);
      const [description, setDescription] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        onSubmit({
          id: 'don-' + Date.now(),
          itemName,
          category,
          quantityTotal: Number(quantityTotal),
          quantityAvailable: Number(quantityTotal),
          condition,
          city: currentUser.city || 'Pune',
          locality,
          fullAddress: `${locality}, Pune`,
          contactPhone,
          whatsappNumber: contactPhone,
          lat: Number(lat),
          lng: Number(lng),
          pickupPreference: 'Donor Locality Pickup',
          availableUntil: '2026-11-30',
          description,
          donorName: currentUser.name,
          status: 'available',
          photoUrl: 'https://images.unsplash.com/photo-1546410531-bb4caa6b424d?auto=format&fit=crop&w=600&q=80'
        });
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-xl max-h-[90vh] overflow-y-auto p-6 sm:p-8">
            <div className="flex items-center justify-between pb-4 border-b border-slate-100">
              <h3 className="font-heading font-extrabold text-xl text-slate-900">List Items to Donate</h3>
              <button onClick={onClose} className="p-2 rounded-xl text-slate-400 hover:text-slate-600"><Icon name="x" className="w-5 h-5" /></button>
            </div>

            <form onSubmit={handleSubmit} className="mt-5 space-y-4 text-xs">
              <div>
                <label className="font-bold text-slate-700 block mb-1">Item Title *</label>
                <input type="text" required placeholder="e.g. 10 Sturdy School Bags" value={itemName} onChange={(e) => setItemName(e.target.value)} className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm" />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Category *</label>
                  <select value={category} onChange={(e) => setCategory(e.target.value)} className="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-xs bg-white">
                    <option value="Education">Education</option>
                    <option value="Food & Nutrition">Food & Nutrition</option>
                    <option value="Clothing & Warmth">Clothing & Warmth</option>
                    <option value="Healthcare Essentials">Healthcare Essentials</option>

                <div>
                  <label className="font-bold text-slate-700 block mb-1">Quantity *</label>
                  <input type="number" min="1" required value={quantityTotal} onChange={(e) => setQuantityTotal(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs" />

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="font-bold text-slate-700 block mb-1">Contact Phone (For Requesters) *</label>

                <label className="font-bold text-slate-700 block mb-1">Description *</label>

              <div className="pt-4 flex justify-end gap-3 border-t border-slate-100">

    // =========================================================================
    // MODAL: OFFER HELP
    // =========================================================================
    function OfferHelpModal({ request, currentUser, onClose, onSubmit }) {
      const [quantity, setQuantity] = useState(Math.min(request.quantityNeeded - request.quantityFulfilled, 10));
      const [message, setMessage] = useState(`Namaste! I would like to offer ${quantity} items to help fulfill your request in ${request.locality}.`);

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-md p-6 sm:p-8">
            <div className="flex items-center justify-between pb-3 border-b border-slate-100">
              <h3 className="font-heading font-extrabold text-lg text-slate-900">Offer to Fulfill Need</h3>
              <button onClick={onClose} className="p-2 text-slate-400 hover:text-slate-600"><Icon name="x" className="w-5 h-5" /></button>
            </div>

            <form onSubmit={(e) => { e.preventDefault(); onSubmit({ quantity: Number(quantity), message }); }} className="mt-4 space-y-3 text-xs">
              <div className="p-3 bg-slate-50 rounded-xl space-y-1">
                <p className="font-bold text-slate-800">{request.title}</p>
                <p className="text-slate-500">Needed in {request.locality} • Call: {request.contactPhone}</p>
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Offered Quantity</label>
                <input type="number" min="1" max={request.quantityNeeded - request.quantityFulfilled} required value={quantity} onChange={(e) => setQuantity(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm" />
              </div>

              <div>
                <label className="font-bold text-slate-700 block mb-1">Message</label>
                <textarea rows="3" required value={message} onChange={(e) => setMessage(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs"></textarea>
              </div>

              <div className="pt-3 flex justify-end gap-2 border-t border-slate-100">
                <button type="button" onClick={onClose} className="px-3.5 py-2 rounded-xl border border-slate-200">Cancel</button>
                <button type="submit" className="px-5 py-2 rounded-xl bg-saffron-500 text-white font-bold">Send Offer</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: COORDINATION CHAT
    // =========================================================================
    function CoordinationModal({ offer, currentUser, onClose, onMarkHandedOver, onConfirmReceipt }) {
      const [messages, setMessages] = useState([
        { sender: offer.donorName, text: offer.message, time: 'Yesterday' },
        { sender: offer.recipientName, text: 'Namaste! Let us coordinate meeting at Akurdi community center.', time: '2 hours ago' }
      ]);
      const [newMsg, setNewMsg] = useState('');

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
          <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 w-full max-w-lg overflow-hidden flex flex-col">
            <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50">
              <h3 className="font-heading font-bold text-sm text-slate-900">Coordination & Handover Chat</h3>
              <button onClick={onClose} className="p-1.5 text-slate-400 hover:text-slate-600"><Icon name="x" className="w-5 h-5" /></button>
            </div>

            <div className="p-4 flex-1 max-h-72 overflow-y-auto space-y-3 bg-slate-50 text-xs">
              {messages.map((m, idx) => (
                <div key={idx} className={`flex flex-col ${m.sender === currentUser.name ? 'items-end' : 'items-start'}`}>
                  <span className="text-[10px] text-slate-400 mb-0.5">{m.sender}</span>
                  <div className={`p-2.5 rounded-2xl max-w-[80%] ${m.sender === currentUser.name ? 'bg-brand-700 text-white' : 'bg-white border border-slate-200 text-slate-800'}`}>
                    {m.text}
                  </div>
                </div>
              ))}
            </div>

            <form onSubmit={(e) => { e.preventDefault(); if (newMsg.trim()) { setMessages([...messages, { sender: currentUser.name, text: newMsg, time: 'Just now' }]); setNewMsg(''); }}} className="p-3 bg-white border-t border-slate-200 flex gap-2">
              <input type="text" placeholder="Type message..." value={newMsg} onChange={(e) => setNewMsg(e.target.value)} className="flex-1 px-3 py-2 rounded-xl border border-slate-200 text-xs" />
              <button type="submit" className="px-4 py-2 rounded-xl bg-slate-900 text-white font-bold text-xs">Send</button>
            </form>

            <div className="p-3 bg-slate-100 border-t border-slate-200 flex justify-end gap-2 text-xs">
              {offer.status !== 'handed_over' && offer.status !== 'received' && (
                <button onClick={onMarkHandedOver} className="px-3.5 py-1.5 rounded-xl bg-saffron-500 text-white font-bold">Mark as Handed Over</button>
              )}
              {offer.status !== 'received' && (
                <button onClick={onConfirmReceipt} className="px-3.5 py-1.5 rounded-xl bg-emerald-600 text-white font-bold">Confirm Receipt</button>
              )}
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // MODAL: NGO VERIFICATION INSPECTION (ADMIN)
    // =========================================================================
    function NGOVerifyModal({ ngo, onClose, onApprove, onReject }) {

              <p>✔ Physical location confirmed in {ngo.locality}, {ngo.city}</p>

            <div className="flex justify-end gap-2 text-xs">

              <button onClick={onApprove} className="px-4 py-1.5 rounded-xl bg-emerald-600 text-white font-bold">Approve NGO</button>
            </div>
          </div>
        </div>
      );
    }

    // Mount Application
    const rootElement = document.getElementById('root');
    ReactDOM.createRoot(rootElement).render(<App />);
  </script>
